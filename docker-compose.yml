version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: foodwaste_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: foodwaste_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: foodwaste_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/foodwaste_db
      SECRET_KEY: mvp-super-secret-key-change-in-production-hotel-banquet-2026
      DEMO_EMAIL: demo@example.com
      DEMO_PASSWORD: demo123
      DEMO_HOTEL_NAME: "Dolphin Hotels"
      AI_MODE: mock
      AI_CONFIDENCE_THRESHOLD: "0.70"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: foodwaste_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
